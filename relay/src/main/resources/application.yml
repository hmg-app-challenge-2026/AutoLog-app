server:
  port: 8080
  # 한도 초과 업로드도 끝까지 읽고 413을 돌려준다(기본 2MB면 연결을 끊음). 전체 크기는 nginx 16m가 막는다
  tomcat.max-swallow-size: 20MB
spring:
  application.name: autolog-relay
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/autolog}
    username: ${DB_USER:autolog}
    password: ${DB_PASSWORD:autolog}
  flyway.enabled: true
  servlet.multipart:
    max-file-size: 15MB      # 사진 1장
    max-request-size: 16MB   # 사진 + multipart 헤더. nginx client_max_body_size 와 맞춘다

autolog:
  public-base-url: ${PUBLIC_BASE_URL:http://localhost}   # QR에 들어갈 주소 (폰이 접속)
  admin:
    session-hours: 12                  # 회사 관리자 로그인 유지 시간(/admin/auth/login)
    signups-per-hour: 30               # 회사 가입(/admin/auth/signup) 서버 전체 시간당 상한 — 자동 대량 가입 방지
  ops:
    token: ${OPS_TOKEN:${ADMIN_TOKEN:}}   # 운영자 토큰 — 회사·관리자 계정 만들기(/ops). 비어 있으면 /ops 비활성. 예전 ADMIN_TOKEN도 받는다
  mail:
    secret-key: ${MAIL_SECRET_KEY:}    # 회사 메일 앱 비밀번호 암호화 키. 서버 .env에만. 바꾸면 저장된 비밀번호를 다시 넣어야 한다
  connect-code-ttl-hours: 24
  qr-token-ttl-minutes: 10
  inbox-retention-days: 30
  gemini:
    api-key: ${GEMINI_API_KEY:}        # 서버 환경변수에만. APK·웹에 두지 않는다.
    model: ${GEMINI_MODEL:gemini-3.5-flash-lite}   # 2.5-flash는 새 키에서 막혔다(2026-11). 바꾸려면 .env GEMINI_MODEL
    base-url: https://generativelanguage.googleapis.com
    max-attempts: 3
  storage:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minio}
    secret-key: ${MINIO_SECRET_KEY:minio12345}
    public-endpoint: ${MINIO_PUBLIC_ENDPOINT:http://localhost:9000}   # 차가 썸네일을 받을 주소(서명 URL 호스트)
    bucket: receipts
    signed-url-days: 7
  receipt-retention-days: 30
  geocoder:
    kakao-key: ${KAKAO_REST_KEY:}      # 주소 → 좌표(운영 웹)·좌표 → 주소(GET /v1/geo/reverse). 비어 있으면 둘 다 끈다
    base-url: https://dapi.kakao.com

management.endpoints.web.exposure.include: health
