# 사용법 (ops/ 에서):
#   (cd .. && ./gradlew :relay:bootJar)      # relay jar 먼저 빌드
#   (cd ../web/admin && npm install && npm run build)
#   cp .env.example .env && docker compose up -d
services:
  relay:
    build: ../relay
    environment:
      SPRING_PROFILES_ACTIVE: demo
      DB_URL: jdbc:postgresql://postgres:5432/autolog
      DB_USER: autolog
      DB_PASSWORD: ${DB_PASSWORD}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      KAKAO_REST_KEY: ${KAKAO_REST_KEY:-}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
      OPS_TOKEN: ${OPS_TOKEN:-${ADMIN_TOKEN:-}}
      MAIL_SECRET_KEY: ${MAIL_SECRET_KEY:-}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
    ports: ["8080:8080"]
    depends_on: [postgres, minio]

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: autolog
      POSTGRES_USER: autolog
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]

  minio:
    # MinIO 공식 이미지(minio/minio)는 더 이상 공개 배포되지 않는다(2026-11 확인). S3 호환 대체: chainguard/minio
    image: chainguard/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio:/data]

  nginx:
    image: nginx:1.27
    ports: ["80:80"]
    volumes:
      - ./nginx:/etc/nginx/conf.d:ro
      - ../web/dist:/usr/share/nginx/html/web:ro
      - ../web/camera:/usr/share/nginx/html/camera:ro
    depends_on: [relay]

volumes:
  pgdata:
  minio:
