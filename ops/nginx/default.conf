# 시연용 HTTP. 배포 시 443 + TLS 인증서 추가.
server {
    listen 80;

    # 운영 웹 (React 빌드 결과). 끝 슬래시 없이 치거나 첫 화면으로 와도 운영 웹으로 보낸다
    location = / { return 302 /admin/; }
    location = /admin { return 301 /admin/; }
    location /admin/ {
        alias /usr/share/nginx/html/web/admin/;
        try_files $uri $uri/ /admin/index.html;
    }
    location /admin/api/ { proxy_pass http://relay:8080/admin/; }

    # 폰 카메라 페이지: GET /r/{code} → 정적 HTML, POST /r/{code}/receipt → relay
    location ~ ^/r/[^/]+/receipt$ {
        client_max_body_size 16m;
        proxy_pass http://relay:8080;
    }
    location ~ ^/r/[^/]+$ {
        default_type text/html;
        alias /usr/share/nginx/html/camera/index.html;
    }

    # 차량 앱 API
    location /v1/ { proxy_pass http://relay:8080; }
}
